# The panel is a contribution route: it stamps provenance and pushes to the
# Commons on a contributor's behalf, so a regression here writes bad data
# rather than merely breaking a page.
name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pins the validator to a specification tag)
        run: pip install -e "./backend[dev]"
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npx tsc -b
        working-directory: frontend
      - name: Unit tests
        run: npx vitest run
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend
