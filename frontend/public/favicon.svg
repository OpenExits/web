<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="OpenExits">
  <title>OpenExits</title>
  <rect width="32" height="32" rx="6" fill="#14161a"/>
  <!-- Heavier stroke and a larger dot than the wordmark version: at 16px the
       hairline vanishes and the exit point is the only legible element. -->
  <path d="M5 25 L15.5 6.5 L21 16 L24.5 10.5 L27 25"
        fill="none" stroke="#f2f0ea" stroke-width="2.8"
        stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="15.5" cy="6.5" r="3.4" fill="#e84e10"/>
</svg>
