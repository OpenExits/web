[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openexit-panel"
version = "0.1.0"
description = "OpenExit web panel backend: contribution wizard API, moderation, publisher bot"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23",
    "filelock>=3.13",
    "pillow>=10",
    "python-ulid>=2",
    "openexit-validator",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["openexit_panel*"]
