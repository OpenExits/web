[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openexits-panel"
version = "0.1.0"
description = "OpenExits web panel backend: contribution wizard API, moderation, publisher bot"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23",
    "filelock>=3.13",
    "pillow>=10",
    "python-ulid>=2",
    # Pinned to a specification release, exactly as commons/ci/requirements.txt is:
    # the panel validates submissions with the same validator version CI will gate them
    # with, so the panel cannot accept something CI would then reject.
    # Local development overrides this with: pip install -e ../../specification/tools
    "openexits-validator @ git+https://github.com/OpenExits/specification@v2.0.2#subdirectory=tools",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["openexits_panel*"]
